# Mismas comprobaciones que pide CLAUDE.md al cerrar cada tarea, en cada PR y en cada push a main
# (incluidos los commits que hace Lovable).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun.lock es el lockfile que mantiene Lovable; package-lock.json está desincronizado.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      # T14.1 · El mismo control de tipos que hace Lovable al desplegar las Edge Functions (Deno, no el tsconfig de la app).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --no-lock supabase/functions/*/index.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
