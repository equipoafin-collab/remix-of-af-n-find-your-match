# Mismas comprobaciones que pide CLAUDE.md al cerrar cada tarea, en cada PR y en cada push a main
# (incluidos los commits que hace Lovable).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun.lock es el lockfile que mantiene Lovable; package-lock.json está desincronizado.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
